# Drop-in for asl-dmr-bridge.service -- required when using the dynarmic
# vocoder backend (standalone or as decoder_backend = "dynarmic" under
# [vocoder.neural]).  The dynarmic JIT code cache requires W+X memory
# mappings, which the shipped unit denies by default.
#
# Install:
#   sudo mkdir -p /etc/systemd/system/asl-dmr-bridge.service.d
#   sudo cp allow-wx.conf /etc/systemd/system/asl-dmr-bridge.service.d/
#   sudo systemctl daemon-reload
[Service]
MemoryDenyWriteExecute=no
