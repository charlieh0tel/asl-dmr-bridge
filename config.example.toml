# Required fields are uncommented.  Commented fields are optional;
# `# default` marks lines whose value is the default, otherwise the
# commented value is a placeholder you'd fill in.

# BM peer identity and metadata (Homebrew RPTC config packet).
[peer]
# Amateur callsign.
callsign = "N0CALL"
# 32-bit Homebrew repeater identity (your RadioID hotspot ID).  May
# exceed 24 bits for BM hotspots.
dmr_id = 123456789
# 24-bit on-air subscriber ID (DMRD src_id, embedded LC).  Must be
# distinct from dmr_id when dmr_id exceeds 24 bits.
src_id = 1234567
# Receive frequency, Hz, non-zero.
rx_freq = 434000000
# Transmit frequency, Hz, non-zero.  Distinct from rx_freq for duplex
# hotspots.
tx_freq = 439000000
# Free-form power string sent in the peer profile.
# tx_power = ""                 # default
# DMR color code, 0..15.
# color_code = 1                # default
# Decimal degrees.
# latitude = 0.0                # default
# longitude = 0.0               # default
# Antenna height, meters.
# height = 0                    # default
# Free-form location / description / URL.
# location = ""                 # default
# description = ""              # default
# url = ""                      # default
# RadioID-style user.csv; populates `call` and `name` in USRP TEXT
# call metadata.  See docs/USRP-METADATA.md.
subscriber_file = "/var/lib/asl-dmr-bridge/subscribers/user.csv"
# Re-load period for subscriber_file.  "0s" = startup only.
subscriber_refresh_interval = "1d"


# ASL3 USRP endpoint.
[usrp]
# Bind address for the local USRP socket.
local_host = "127.0.0.1"
# Local receive port.
local_port = 34001
# ASL3 chan_usrp host.
remote_host = "127.0.0.1"
# ASL3 chan_usrp receive port.
remote_port = 34002
# Swap audio sample bytes for cross-endian USRP peers.
# byte_swap = false             # default


# AMBE codec backend.
[vocoder]
# `dynarmic` requires `--features dynarmic` and is not in the pre-built debs.
backend = "thumbdv"             # thumbdv | neural | ambeserver | dynarmic

# ThumbDV serial hardware; required when backend = "thumbdv".
# Also used when backend = "neural" with encoder/decoder = "thumbdv".
[vocoder.thumbdv]
serial_port = "/dev/ttyUSB0"
# serial_baud = 460800          # default

# AMBEserver UDP proxy; required when backend = "ambeserver".
# Also used when backend = "neural" with encoder/decoder = "ambeserver".
# [vocoder.ambeserver]
# host = "127.0.0.1"
# port = 2460                   # default

# Neural vocoder; required when backend = "neural".
# At least one of encoder_backend/decoder_backend must be "neural".
# [vocoder.neural]
# encoder_backend = "neural"    # default; neural | dynarmic | thumbdv | ambeserver
# decoder_backend = "dynarmic"  # default; neural | dynarmic | thumbdv | ambeserver
# encoder_model_path = "/usr/share/asl-dmr-bridge/models/encoder-aug58-linear-scratch-2026-06-14.onnx"
#
# Neural decoder sub-config; required when decoder_backend = "neural".
# [vocoder.neural.decoder]
# step = "native_gru"           # default; native_gru | onnx
# split_dir = "/usr/share/asl-dmr-bridge/models/decoder-h128-v6-weights"   # frame.onnx (+ step.onnx if onnx)
# weights_dir = "/usr/share/asl-dmr-bridge/models/decoder-h128-v6-weights" # required for native_gru


# DMR call routing.
[dmr]
# Direction(s) the bridge forwards voice.
# gateway = "both"              # default; both | dmr_to_fm | fm_to_dmr
# DMR timeslot.
slot = 1
# Talkgroup to bridge.
talkgroup = 1234567
# Group or unit-to-unit (private) call.
call_type = "group"             # group | private
# DMR-side hang after end of TX.
hang_time = "500ms"
# Max gap before a DMR stream is considered lost.
stream_timeout = "5s"
# Max single-call duration before forced terminator.
# tx_timeout = "180s"           # default


# Brandmeister master connection.
[network]
# DMR network profile.
profile = "brandmeister"
# Master host.
host = "3102.master.brandmeister.network"
# Master port (62031 for BM Homebrew).
port = 62031
# BM hotspot password.  Sources, exactly one: BRANDMEISTER_PASSWORD
# env, password = "...", password_file = "<path>", --password-file CLI.
# password = "your-hotspot-password"
# password_file = "/etc/asl-dmr-bridge/password"
# Keepalive period; must be > 0.
keepalive_interval = "5s"
# Reconnect after this many missed keepalives.
keepalive_missed_limit = 3


# Halligan API.  Presence of this section triggers an anonymous
# peer-profile GET on startup; supplying api_key plus
# static_talkgroups_tsN enables pure-set reconciliation of BM-side
# static talkgroups.  Delete the section entirely to suppress all
# API calls.
[brandmeister_api]
# Bearer JWT.  Sources, one: BRANDMEISTER_API_KEY env, api_key,
# api_key_file, --api-key-file CLI.
# api_key = "..."
# api_key_file = "/etc/asl-dmr-bridge/api-key"
# TS1 / TS2 static-TG reconcile target.  [] empties the slot; omit =
# leave it untouched.
# static_talkgroups_ts1 = []
# static_talkgroups_ts2 = []
# Re-run period for the provisioning logic.  "0s" = startup only.
# reconcile_interval = "0s"     # default


# Peak-tracking AGC, configured per direction.  Same field set on
# both subsections; only the defaults differ.
[agc.dmr_to_fm]
# enabled = false               # default
# target_dbfs = -6.0            # default
# attack = "10ms"               # default
# release = "120ms"             # default
# max_gain_db = 18.0            # default
# noise_gate_dbfs = -50.0       # default

[agc.fm_to_dmr]
# enabled = false               # default
# Hotter target (FM-side input has wider variance and tends to
# come in quiet).
# target_dbfs = -3.0            # default
# attack = "10ms"               # default
# release = "120ms"             # default
# max_gain_db = 18.0            # default
# noise_gate_dbfs = -50.0       # default


# Per-direction brick-wall peak limiter applied after AGC.  Scales
# the frame down so the peak equals `ceiling_dbfs` exactly; no-op
# when the frame is already within bounds.
[limiter.dmr_to_fm]
# enabled = false               # default
# ceiling_dbfs = -1.0           # default; 1 dB below full scale

[limiter.fm_to_dmr]
# enabled = false               # default
# ceiling_dbfs = -1.0           # default


# Per-call summary lines + cumulative-counter heartbeat.
[stats]
# Heartbeat period.  "0s" disables the heartbeat (per-call lines
# still emit).
# heartbeat_interval = "60s"    # default
# Suppress heartbeat ticks with no traffic since the previous tick.
# skip_idle_heartbeat = true    # default
# Per-call lines below this duration are suppressed.
# min_call_log_duration = "250ms"   # default
# Rollup summary period.  "0s" disables.
# summary_interval = "12h"          # default


# FM->DMR pre-encode voice-band filter (HP4 @ 250 Hz + LP2 @ 3000 Hz).
[encode_filter]
# enabled = false               # default


# Static dB gain on each direction.  Routed to the chip when the
# vocoder direction is on hardware (rounded, clamped +-90 dB);
# applied as a software multiplier otherwise.
[gain]
# fm_to_dmr_db = 0.0            # default; pre-encode (USRP-rx PCM)
# dmr_to_fm_db = 0.0            # default; post-decode (vocoder out)


# Per-call capture: 8 kHz mono i16 WAVs at encoder input and decoder
# output (pre/post-AGC) + 7-byte mbelib-packed AMBE source-bit
# sidecars; emits a `call_levels` log line per point.
[diagnostics]
# pcm_record_dir = "/var/lib/asl-dmr-bridge/pcm"
