[workspace]
members = ["ambe", "ambe/dynarmic-sys", "ambeserver", "bmcli", "brandmeister-api", "bridge", "dmr-events", "dmr-subscriber", "dmr-types", "dmr-wire", "dsp", "dv3000-wire", "pcm-utils", "usrp-wire"]
resolver = "3"

[workspace.package]
version = "2.11.0"
edition = "2024"
license = "GPL-2.0-or-later"

[workspace.dependencies]
# Local crates -- path-only.  Each crate inherits the version via
# `version.workspace = true` from [workspace.package], so a release
# bump touches a single line in this file.  Path-only entries are
# not publishable to crates.io; this workspace ships as a deb only.
ambe = { path = "ambe" }
brandmeister-api = { path = "brandmeister-api" }
dmr-subscriber = { path = "dmr-subscriber" }
dmr-types = { path = "dmr-types" }
dmr-events = { path = "dmr-events" }
dmr-wire = { path = "dmr-wire" }
dsp = { path = "dsp" }
dv3000-wire = { path = "dv3000-wire" }
dynarmic-sys = { path = "ambe/dynarmic-sys" }
pcm-utils = { path = "pcm-utils" }
usrp-wire = { path = "usrp-wire" }

# External deps.  Features that are "always wanted" live here; features
# specific to one consumer (tokio runtimes, signal handlers, etc.) stay
# in the consumer's Cargo.toml as additive overrides.
anyhow = "1.0.102"
cc = "1"
clap = { version = "4.6.1", default-features = false, features = ["derive", "error-context", "help", "std", "suggestions", "usage"] }
cpal = "0.17.3"
csv = "1.4"
getrandom = "0.4.2"
hex = "0.4.3"
humantime-serde = "1.1.1"
proptest = "1.11.0"
reqwest = { version = "0.13.3", features = ["json"] }
secrecy = "0.10.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serialport = "4.9.0"
sha2 = "0.11.0"
tempfile = "3.27.0"
thiserror = "2.0.18"
tokio = "1.52.1"
tokio-util = { version = "0.7.18", features = ["rt"] }
toml = "1.1.2"
tract-onnx = "0.22.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"
wiremock = "0.6.5"
