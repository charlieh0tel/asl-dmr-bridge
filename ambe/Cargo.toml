[package]
name = "ambe"
version = "1.7.0"
edition.workspace = true
license.workspace = true

[features]
dynarmic = ["dep:dynarmic-sys"]
thumbdv = ["dep:serialport"]
# Implies dynarmic because the neural backend is encode-only and
# delegates decode to dynarmic.
neural = ["dep:tract-onnx", "dynarmic"]
# Exposes `test_harness` + `test_vectors` for integration tests and
# the `gen_golden` example.  Off by default so the public API of the
# crate doesn't include test-only code.
testing = []

[dependencies]
clap.workspace = true
dynarmic-sys = { workspace = true, optional = true }
serialport = { workspace = true, optional = true }
thiserror.workspace = true
tracing.workspace = true
tract-onnx = { workspace = true, optional = true }

[dev-dependencies]
anyhow.workspace = true
hound = "3.5.1"
proptest.workspace = true
serde = { workspace = true }
serde_json.workspace = true
serial_test = "3.4.0"
tracing-subscriber.workspace = true

# `gen_golden` and the golden integration tests need the `testing`
# feature to access TEST_FRAMES + decode_test_frames; mark
# required-features so cargo skips the targets cleanly otherwise
# instead of failing with a missing-symbol compile error.

[[example]]
name = "gen_golden"
required-features = ["testing"]

[[example]]
name = "bridge_vq_parity"
required-features = ["neural"]

[[test]]
name = "thumbdv_golden"
required-features = ["testing", "thumbdv"]

[[test]]
name = "ambeserver_golden"
required-features = ["testing"]

[[test]]
name = "neural_parity"
required-features = ["neural"]

[[test]]
name = "dynarmic_codec"
required-features = ["dynarmic"]

[[example]]
name = "silence_probe"
required-features = ["neural"]

[[example]]
name = "cross_loopback"
required-features = ["dynarmic", "thumbdv", "neural"]
