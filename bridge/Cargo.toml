[package]
name = "asl-dmr-bridge"
version = "2.0.0"
edition.workspace = true
license.workspace = true
description = "Bridge between AllStarLink (ASL3) FM repeaters and Brandmeister DMR networks via the Homebrew protocol."

[features]
# Pre-built debs ship without `dynarmic` -- operators wanting the
# MD380-firmware backend (standalone or as neural_decoder) build
# from source with `--features dynarmic`.  `neural` pulls
# `ambe/dynarmic` transitively for callers who want that path.
default = ["neural", "thumbdv"]
dynarmic = ["ambe/dynarmic"]
thumbdv = ["ambe/thumbdv"]
neural = ["ambe/neural"]
# Forwards to `ambe/testing` so workspace-wide `cargo test --features
# testing` reaches the goldens + gen_golden.
testing = ["ambe/testing"]

[dependencies]
ambe.workspace = true
brandmeister-api.workspace = true
dmr-subscriber.workspace = true
dmr-types.workspace = true
dmr-events.workspace = true
dmr-wire.workspace = true
dsp.workspace = true
pcm-utils.workspace = true
usrp-wire.workspace = true
anyhow.workspace = true
clap.workspace = true
hex.workspace = true
humantime-serde.workspace = true
secrecy = { workspace = true, features = ["serde"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
cpal.workspace = true
proptest.workspace = true
syn = { version = "2.0.117", features = ["full", "parsing"] }
tempfile.workspace = true
url.workspace = true
wiremock.workspace = true

[build-dependencies]
clap.workspace = true
clap_mangen = "0.3.0"

[package.metadata.deb]
maintainer = "Christopher Hoover (AI6KG) <ch@murgatroid.com>"
copyright = "2026, Christopher Hoover (AI6KG)"
license-file = ["../LICENSE", "0"]
extended-description = """\
asl-dmr-bridge connects an AllStarLink (ASL3) FM node to a Brandmeister \
DMR repeater over the Homebrew protocol, transcoding USRP-format audio \
to AMBE+2 via a neural / dynarmic / ThumbDV / AMBEserver backend.  \
Includes a systemd unit and a sample configuration."""
section = "hamradio"
priority = "optional"
# $auto picks up dynamically-linked deps (libc, etc.).  libudev1 is
# loaded via dlopen by the serialport crate (thumbdv backend), which
# dpkg-shlibdeps cannot see, so list it explicitly.  wget runs the
# daily subscriber-DB refresh.
depends = "$auto, libudev1, wget"
maintainer-scripts = "../packaging/maintainer-scripts/"
assets = [
    ["target/release/asl-dmr-bridge", "usr/bin/", "0755"],
    ["target/release/ambeserver", "usr/bin/", "0755"],
    ["target/release/man/asl-dmr-bridge.1", "usr/share/man/man1/", "0644"],
    ["target/release/man/ambeserver.1", "usr/share/man/man1/", "0644"],
    ["../config.example.toml", "usr/share/doc/asl-dmr-bridge/examples/config.example.toml", "0644"],
    ["../docs/INSTALL.md", "usr/share/doc/asl-dmr-bridge/INSTALL.md", "0644"],
    ["../docs/CODEC.md", "usr/share/doc/asl-dmr-bridge/CODEC.md", "0644"],
    ["../packaging/ambeserver.default", "etc/default/ambeserver", "0644"],
    ["../packaging/ambeserver.service", "lib/systemd/system/", "0644"],
    ["../packaging/asl-dmr-bridge.default", "etc/default/asl-dmr-bridge", "0600"],
    ["../packaging/asl-dmr-bridge.service", "lib/systemd/system/", "0644"],
    ["../packaging/asl-dmr-bridge-update-subscribers.service", "lib/systemd/system/", "0644"],
    ["../packaging/asl-dmr-bridge-update-subscribers.timer", "lib/systemd/system/", "0644"],
    ["../packaging/asl-dmr-bridge-update-subscribers", "usr/lib/asl-dmr-bridge/update-subscribers", "0755"],
    ["../packaging/asl-dmr-bridge.tmpfiles", "usr/lib/tmpfiles.d/asl-dmr-bridge.conf", "0644"],
    ["../packaging/99-thumbdv.rules", "lib/udev/rules.d/", "0644"],
    ["../models/dmr50.onnx", "usr/share/asl-dmr-bridge/models/dmr50-2026-05-04.onnx", "0644"],
    ["../models/aug50.onnx", "usr/share/asl-dmr-bridge/models/aug50-2026-05-06.onnx", "0644"],
]
conf-files = [
    "/etc/default/asl-dmr-bridge",
    "/etc/default/ambeserver",
]
