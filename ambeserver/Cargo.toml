[package]
name = "ambeserver"
version = "2.2.0"
edition.workspace = true
license.workspace = true
description = "UDP-to-serial proxy for a DVSI AMBE-3000R chip with one-active-session exclusivity."

[features]
default = ["thumbdv"]
# UDP-to-serial relay for a ThumbDV (or any DVSI AMBE-3000R over a
# serial port).  https://wuwt.myshopify.com/products/thumbdv-tm-
thumbdv = ["dep:serialport"]
# Software vocoder backends.  `neural` implies dynarmic because the
# neural backend's decode delegates to dynarmic.
dynarmic = ["ambe/dynarmic"]
neural = ["ambe/neural"]

[dependencies]
ambe.workspace = true
anyhow.workspace = true
clap = { workspace = true, features = ["derive", "error-context", "help", "std", "suggestions", "usage"] }
dsp.workspace = true
dv3000-wire.workspace = true
serialport = { workspace = true, optional = true }
tracing.workspace = true
tracing-subscriber.workspace = true

[build-dependencies]
clap = { workspace = true, features = ["derive", "std"] }
clap_mangen = "0.3.0"
