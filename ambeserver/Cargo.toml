[package]
name = "ambeserver"
version = "2.0.0"
edition.workspace = true
license.workspace = true
description = "UDP-to-serial proxy for a DVSI AMBE-3000R chip with one-active-session exclusivity."

[dependencies]
ambe.workspace = true
anyhow.workspace = true
clap = { workspace = true, features = ["derive", "error-context", "help", "std", "suggestions", "usage"] }
serialport.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[build-dependencies]
clap = { workspace = true, features = ["derive", "std"] }
clap_mangen = "0.3.0"
