name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # The shared workflow, so this repository's CI matches the rest. It grew the
  # three inputs this job needed: submodules, so dynarmic and the vendored
  # sources are there to compile; cache-directories, because dynarmic-sys
  # pre-clones dynarmic into target/dynarmic-src and the cache prunes target/
  # to the paths it knows about, re-cloning on every restore otherwise; and
  # test-args, for the feature the tests need.
  ci:
    uses: charlieh0tel/deb-workflows/.github/workflows/rust-ci.yml@v1
    with:
      submodules: recursive
      build-deps: "libasound2-dev libudev-dev libboost-dev cmake"
      cache-directories: target/dynarmic-src
      # --workspace: sixteen crates live here, and clippy without it looked at
      # one of them. `testing` exposes test_harness and test_vectors, so the
      # golden integration tests and the gen_golden example are reachable.
      check-args: "--workspace --all-targets --features testing"
      test-args: "--features testing"
      # rust-toolchain.toml pins 1.98.1 and the workflow reads it, so the
      # version is named once now rather than here as well. Empty rather than
      # absent: the default is nightly, which would fetch a second toolchain
      # for rustfmt alone.
      fmt-toolchain: ""
