name: Build Debian Package

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build-deb:
    uses: charlieh0tel/deb-workflows/.github/workflows/rust-build-deb.yml@v1
    with:
      # Build the whole workspace so the deb ships the bridge and
      # ambeserver binaries.  cargo-deb without -p picks up
      # asl-dmr-bridge as the only [package.metadata.deb] crate.
      package: ""
      build-deps: "libasound2-dev libudev-dev libboost-dev cmake"
      run-tests: false
      submodules: recursive
    secrets: inherit

  update-apt-repo:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-deb
    runs-on: ubuntu-latest
    steps:
      - name: Trigger APT repo rebuild
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.APT_REPO_TOKEN }}
          repository: charlieh0tel/apt-repo
          event-type: update-apt-repo