name: Build Debian Package

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-deb:
    uses: charlieh0tel/deb-workflows/.github/workflows/rust-build-deb.yml@v1
    # Scoped to this job.  At workflow level it would also be granted to
    # the dispatch job below, which authenticates with its own PAT and
    # writes nothing here.
    permissions:
      contents: write
    with:
      # Build the whole workspace so the deb ships the bridge and
      # ambeserver binaries.  cargo-deb without -p picks up
      # asl-dmr-bridge as the only [package.metadata.deb] crate.
      package: ""
      # Match rust-toolchain.toml; the toml wins once cargo runs, so a
      # different value here would only install a second toolchain.
      toolchain: "1.98.1"
      build-deps: "libasound2-dev libudev-dev libboost-dev cmake"
      run-tests: false
      submodules: recursive

  update-apt-repo:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-deb
    runs-on: ubuntu-latest
    steps:
      - name: Trigger APT repo rebuild
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
        with:
          token: ${{ secrets.APT_REPO_TOKEN }}
          repository: charlieh0tel/apt-repo
          event-type: update-apt-repo
